name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify the release ref
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Run this workflow from a version tag such as v0.3.0."
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Build CLI archives
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"
      - name: Build the Visual Studio Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package:vsix
          cp "dist/kinmokusei-${GITHUB_REF_NAME#v}.vsix" ../../dist/
      - name: Verify release artifacts
        run: |
          ./scripts/write-release-checksums.sh dist
          ./scripts/verify-release.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: kinmokusei-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Kinmokusei ${GITHUB_REF_NAME}"
