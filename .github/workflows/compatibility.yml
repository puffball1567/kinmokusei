name: Compatibility

on:
  pull_request:
  push:
    branches:
      - devel
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  classify:
    name: Classify compatibility run
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - name: Select full CI or verified reuse
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BASE_REF" != "main" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "::error::Pull requests to main must come from this repository."
            exit 1
          fi

          case "$HEAD_REF" in
            devel)
              echo "mode=reuse" >> "$GITHUB_OUTPUT"
              ;;
            hotfix/*)
              echo "mode=full" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Pull requests to main must come from devel or hotfix/*."
              exit 1
              ;;
          esac

  reused-devel-ci:
    name: Verify successful devel CI
    if: ${{ needs.classify.outputs.mode == 'reuse' }}
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require Compatibility success for the exact devel head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --force origin \
            "+refs/heads/devel:refs/remotes/origin/devel"

          if [ "$(git rev-parse origin/devel)" != "$HEAD_SHA" ]; then
            echo "::error::The pull request no longer points to the current devel head."
            exit 1
          fi

          if ! git diff --quiet "$HEAD_SHA" "$GITHUB_SHA"; then
            echo "::error::The pull request merge contains content that was not verified on devel."
            exit 1
          fi

          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/compatibility.yml/runs?branch=devel&event=push&status=success&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"${HEAD_SHA}\")) | first | .id // empty")
          if [ -z "$run_id" ]; then
            echo "::error::The exact devel head has no successful Compatibility push run."
            exit 1
          fi

          echo "Reusing successful Compatibility run ${run_id} for devel at ${HEAD_SHA}."

  go:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: 1.23.x
          - os: ubuntu-latest
            go-version: 1.24.x
          - os: ubuntu-latest
            go-version: 1.25.x
          - os: ubuntu-latest
            go-version: 1.26.x
          - os: ubuntu-latest
            go-version: 1.27.x
          - os: macos-latest
            go-version: 1.27.x
          - os: windows-latest
            go-version: 1.27.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - if: matrix.os != 'ubuntu-latest' || matrix.go-version != '1.27.x'
        run: go test -timeout 30m ./...
      - if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.x'
        run: ./scripts/coverage.sh
      - run: go vet ./...

  release-toolchain:
    name: Go 1.27 compiler targeting Go ${{ matrix.go-version }}
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.23.x
          - 1.24.x
          - 1.25.x
          - 1.26.x
          - 1.27.x
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - name: Build the release compiler with Go 1.27
        run: go build -trimpath -o "${RUNNER_TEMP}/keika-release" ./cmd/keika
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check direct package import with the target Go toolchain
        run: |
          "${RUNNER_TEMP}/keika-release" check examples/basic/main.km
      - name: Build and run with the target Go toolchain
        run: |
          "${RUNNER_TEMP}/keika-release" build -o "${RUNNER_TEMP}/hello" examples/hello/main.km
          output=$("${RUNNER_TEMP}/hello")
          test "$output" = "Hello from Kinmokusei"

  race:
    name: Race detector
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - run: go test -race -timeout 45m ./...

  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/lexer
            target: FuzzLexNeverPanics
          - package: ./internal/parser
            target: FuzzParseNeverPanics
          - package: ./internal/lsp
            target: FuzzApplyContentChangesNeverPanics
          - package: ./internal/lsp
            target: FuzzRelatedDeclarationsNeverPanics
          - package: ./internal/lsp
            target: FuzzCallContextAtNeverPanics
          - package: ./internal/compiler
            target: FuzzCompilePipelineNeverPanics
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - run: go test -run=^$ -fuzz=${{ matrix.target }} -fuzztime=15s -parallel=1 ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-regressions-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/
          if-no-files-found: ignore

  c_ffi:
    name: Required C ABI and FFI execution
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      KINMOKUSEI_REQUIRE_C_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - name: Verify the C compiler is executable
        run: cc --version
      - name: Run every executable C ABI and incoming FFI test
        run: go test -timeout 30m -count=1 -run '^(TestCABISharedLibraryCompileAndCCallerMatrix|TestIncomingCFFI.*)$' ./internal/compiler

  benchmarks:
    name: Compiler and codegen benchmarks
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - name: Measure compile time and allocations
        run: go test -run=^$ -bench='^BenchmarkKinmokusei(Check|Codegen)$' -benchmem -benchtime=200ms -count=3 ./internal/compiler | tee "${RUNNER_TEMP}/benchmarks.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-benchmarks
          path: ${{ runner.temp }}/benchmarks.txt

  goroutine_leaks:
    name: Goroutine leak detection
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - name: Exercise repeated LSP lifecycle shutdown
        run: go test -count=1 -run '^TestServerLifecycleDoesNotLeakGoroutines$' ./internal/lsp
      - name: Exercise generated and independent task runtimes
        run: go test -count=1 -run '^TestStructuredTasksMatchIndependentGo$' ./internal/compiler

  editor:
    name: Visual Studio Code client
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
      - run: npm run package:vsix

  documentation:
    name: Public language guide
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: ./scripts/check-docs.sh
      - run: npm run docs:build
        working-directory: website

  full-stack-example:
    name: React with Gin and Fiber
    if: ${{ needs.classify.outputs.mode == 'full' }}
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
          cache: true
          cache-dependency-path: |
            go.mod
            examples/react-web-frameworks/backend/.kinmokusei/deps/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/react-web-frameworks/frontend/package-lock.json
      - name: Build the Kinmokusei compiler
        run: |
          mkdir -p "${RUNNER_TEMP}/keika-bin"
          go build -o "${RUNNER_TEMP}/keika-bin/keika" ./cmd/keika
          echo "${RUNNER_TEMP}/keika-bin" >> "$GITHUB_PATH"
      - name: Download the locked backend modules
        working-directory: examples/react-web-frameworks/backend/.kinmokusei/deps
        run: go mod download all
      - name: Compare Gin and Fiber with independent Go implementations
        working-directory: examples/react-web-frameworks/backend
        run: ./verify.sh
      - name: Install the React dependencies
        working-directory: examples/react-web-frameworks/frontend
        run: npm ci
      - name: Test the React state and API transitions
        working-directory: examples/react-web-frameworks/frontend
        run: npm run test:coverage
      - name: Build the production React application
        working-directory: examples/react-web-frameworks/frontend
        run: npm run build
      - name: Exercise the Vite proxy against both generated servers
        working-directory: examples/react-web-frameworks
        run: ./verify.sh

  required:
    name: Required compatibility
    if: ${{ always() }}
    needs:
      - classify
      - reused-devel-ci
      - go
      - release-toolchain
      - race
      - fuzz
      - c_ffi
      - benchmarks
      - goroutine_leaks
      - editor
      - documentation
      - full-stack-example
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility job
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          REUSED_DEVEL_RESULT: ${{ needs.reused-devel-ci.result }}
          GO_RESULT: ${{ needs.go.result }}
          TOOLCHAIN_RESULT: ${{ needs.release-toolchain.result }}
          RACE_RESULT: ${{ needs.race.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          C_FFI_RESULT: ${{ needs.c_ffi.result }}
          BENCHMARK_RESULT: ${{ needs.benchmarks.result }}
          GOROUTINE_LEAK_RESULT: ${{ needs.goroutine_leaks.result }}
          EDITOR_RESULT: ${{ needs.editor.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          FULL_STACK_RESULT: ${{ needs.full-stack-example.result }}
        run: |
          set -euo pipefail

          test "$CLASSIFY_RESULT" = success

          case "$MODE" in
            reuse)
              test "$REUSED_DEVEL_RESULT" = success
              for result in "$GO_RESULT" "$TOOLCHAIN_RESULT" "$RACE_RESULT" "$FUZZ_RESULT" "$C_FFI_RESULT" "$BENCHMARK_RESULT" "$GOROUTINE_LEAK_RESULT" "$EDITOR_RESULT" "$DOCUMENTATION_RESULT" "$FULL_STACK_RESULT"; do
                test "$result" = skipped
              done
              ;;
            full)
              test "$REUSED_DEVEL_RESULT" = skipped
              for result in "$GO_RESULT" "$TOOLCHAIN_RESULT" "$RACE_RESULT" "$FUZZ_RESULT" "$C_FFI_RESULT" "$BENCHMARK_RESULT" "$GOROUTINE_LEAK_RESULT" "$EDITOR_RESULT" "$DOCUMENTATION_RESULT" "$FULL_STACK_RESULT"; do
                test "$result" = success
              done
              ;;
            *)
              echo "::error::Unknown compatibility mode: $MODE"
              exit 1
              ;;
          esac
