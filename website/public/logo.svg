<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Kinmokusei</title>
  <desc id="desc">A four-petalled brass osmanthus blossom and a riveted green metal leaf on an articulated stem.</desc>
  <defs>
    <linearGradient id="brass" x2=".8" y2="1">
      <stop stop-color="#ffd079"/><stop offset="1" stop-color="#d88c24"/>
    </linearGradient>
    <path id="petal" d="M0 0C-9-2-15-12-9-16C-2-21 6-9 0 0Z"/>
  </defs>
  <g stroke="#684620" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
    <path d="M17 57 36 29" fill="none" stroke="#bd853a" stroke-width="6"/>
    <path d="M27 44C33 32 48 29 59 34C50 49 36 53 27 44Z" fill="#71805b"/>
    <path d="M28 44 55 35" fill="none" stroke="#ecc06c"/>
    <g fill="url(#brass)" transform="translate(27 25)">
      <use href="#petal"/><use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(270)"/>
    </g>
    <circle cx="27" cy="25" r="5" fill="url(#brass)"/>
    <path d="m25 27 4-4" fill="none"/>
    <circle cx="25" cy="46" r="4" fill="url(#brass)"/>
    <path d="m23.5 47.5 3-3" fill="none" stroke-width="1.5"/>
    <circle cx="40" cy="36" r="1.6" fill="#f3c26b" stroke-width="1.2"/>
    <circle cx="44" cy="44" r="1.6" fill="#f3c26b" stroke-width="1.2"/>
  </g>
</svg>
